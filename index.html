<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw 10 — Neural Drawing Game</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#f5f5f5;color:#171717;display:flex;justify-content:center}.app{width:min(900px,100%);padding:28px 18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.title{font-size:34px;font-weight:850;letter-spacing:-1px}.stats{font-weight:700}.card{background:white;border:1px solid #ddd;border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 8px 30px #0000000d}.prompt{text-align:center}.prompt small{color:#777;font-weight:700;text-transform:uppercase;letter-spacing:1px}.prompt h1{font-size:42px;margin:5px 0 0}.timer{font-size:30px;font-weight:850;margin:8px 0}.timer.danger{color:#d22}.bar{height:10px;background:#eee;border-radius:20px;overflow:hidden}.bar>div{height:100%;width:100%;background:#171717;transition:width .1s linear}canvas{display:block;width:min(650px,100%);aspect-ratio:1;margin:22px auto;border:3px solid #171717;border-radius:16px;background:white;touch-action:none;cursor:crosshair}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:#171717;color:white}button.secondary{background:#e9e9e9;color:#171717}button.active{background:#555}button:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;min-height:35px;font-size:20px;font-weight:750}.sub{color:#666;font-size:14px;text-align:center;margin-top:12px}.learning{font-size:13px;color:#777;margin-top:15px;text-align:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}.hidden{display:none}@media(max-width:600px){.title{font-size:27px}.prompt h1{font-size:34px}.card{padding:15px}}
</style></head><body><div class="app">
<div class="top"><div class="title">Draw 10</div><div class="stats">Wins: <span id="score">0</span> · Learned: <span id="learned">0</span></div></div>
<div class="card prompt"><small>Draw this in 10 seconds</small><h1 id="target">Loading…</h1><div class="timer" id="timer">10.0</div><div class="bar"><div id="bar"></div></div></div>
<div class="card"><canvas id="canvas" width="420" height="420"></canvas>
<div class="result" id="result">Loading neural network…</div><div class="buttons"><button id="start" disabled>Start round</button><button id="clear" class="secondary">Clear</button><button id="eraser" class="secondary">Eraser: Off</button></div>
<div class="learning"><span class="dot"></span><span id="status">Training the neural network…</span></div><div class="sub">Successful drawings are saved locally as training examples. Nothing is uploaded.</div></div></div>
<script>
const CATEGORIES=['airplane','apple','ball','banana','basket','bicycle','bird','book','bottle','bow','bucket','bus','butterfly','cake','camera','car','cat','chair','cloud','clock','cookie','cup','dog','door','duck','ear','elephant','fish','flower','fork','guitar','hammer','hat','house','key','leaf','moon','mountain','mug','pencil','pizza','rabbit','rocket','shoe','smiley face','star','sun','tree','umbrella','watch'];
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),targetEl=document.getElementById('target'),timerEl=document.getElementById('timer'),bar=document.getElementById('bar'),resultEl=document.getElementById('result'),statusEl=document.getElementById('status'),startBtn=document.getElementById('start'),clearBtn=document.getElementById('clear'),eraserBtn=document.getElementById('eraser');
let strokes=[],current=[],drawing=false,roundActive=false,startTime=0,raf=0,target='',score=0,model=null,erasing=false;const STORE='draw10-training-v1';let learned=JSON.parse(localStorage.getItem(STORE)||'{}');
function updateStats(){document.getElementById('score').textContent=score;document.getElementById('learned').textContent=Object.values(learned).reduce((a,b)=>a+b.length,0)}
function setupCanvas(){ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=9;ctx.strokeStyle='#111'}setupCanvas();updateStats();
function pos(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}
function begin(e){if(!roundActive)return;canvas.setPointerCapture(e.pointerId);drawing=true;current=[pos(e)];ctx.beginPath();ctx.moveTo(...current[0])}
function move(e){if(!drawing)return;const p=pos(e);current.push(p);ctx.lineTo(...p);ctx.stroke()}
function endStroke(){if(drawing&&current.length>1)strokes.push(current);drawing=false;current=[]}
canvas.addEventListener('pointerdown',begin);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',endStroke);canvas.addEventListener('pointercancel',endStroke);
function eraseAt(e){if(!erasing||!roundActive)return;const [x,y]=pos(e);const radius=22;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.restore();strokes=strokes.filter(st=>!st.some(p=>Math.hypot(p[0]-x,p[1]-y)<radius+5))}
canvas.addEventListener('pointerdown',e=>{if(erasing){eraseAt(e);drawing=false}});canvas.addEventListener('pointermove',eraseAt);
eraserBtn.onclick=()=>{erasing=!erasing;eraserBtn.textContent=`Eraser: ${erasing?'On':'Off'}`;eraserBtn.classList.toggle('active',erasing);canvas.style.cursor=erasing?'cell':'crosshair'};
clearBtn.onclick=()=>{strokes=[];setupCanvas();resultEl.textContent=roundActive?'Draw!':''};
function choose(){target=CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)];targetEl.textContent=target}
function start(){if(!model)return;strokes=[];setupCanvas();choose();roundActive=true;startBtn.disabled=true;clearBtn.disabled=false;startTime=performance.now();cancelAnimationFrame(raf);tick()}
function tick(){if(!roundActive)return;let left=Math.max(0,10000-(performance.now()-startTime));timerEl.textContent=(left/1000).toFixed(1);timerEl.classList.toggle('danger',left<3000);bar.style.width=(left/100)+'%';if(left<=0){endRound();return}raf=requestAnimationFrame(tick)}
async function endRound(){roundActive=false;endStroke();timerEl.textContent='0.0';bar.style.width='0%';resultEl.textContent='Thinking…';statusEl.textContent='Classifying your drawing…';const[label,confidence]=await classify(strokes);if(label===target&&confidence>=0.34){score++;saveExample(target,strokes);resultEl.textContent=`🎉 You win! The network said “${label}” (${Math.round(confidence*100)}%).`;statusEl.textContent='Adding your drawing to the training data and retraining…';await train()}else{resultEl.textContent=`Not quite — I saw “${label}” (${Math.round(confidence*100)}%).`;statusEl.textContent='Your drawing was not added because the network did not recognize it.'}updateStats();startBtn.disabled=false;startBtn.textContent='Next round';timerEl.classList.remove('danger')}
function normalize(sts){if(!sts.length)return null;let pts=sts.flat();let minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1])),maxY=Math.max(...pts.map(p=>p[1]));let w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),s=Math.min(330/w,330/h),ox=210-(minX+maxX)/2*s,oy=210-(minY+maxY)/2*s;return sts.map(st=>st.map(p=>[p[0]*s+ox,p[1]*s+oy]))}
function tensorFor(sts){const n=normalize(sts),a=new Float32Array(784);if(!n)return a;let off=document.createElement('canvas');off.width=28;off.height=28;let c=off.getContext('2d');c.fillStyle='white';c.fillRect(0,0,28,28);c.strokeStyle='black';c.lineWidth=1.1;c.lineCap='round';c.lineJoin='round';for(const st of n){if(st.length<2)continue;c.beginPath();c.moveTo(st[0][0]/15,st[0][1]/15);for(let i=1;i<st.length;i++)c.lineTo(st[i][0]/15,st[i][1]/15);c.stroke()}let d=c.getImageData(0,0,28,28).data;for(let i=0;i<784;i++)a[i]=1-d[i*4]/255;return a}
function genericSeed(cat){const s=[];const line=(a,b)=>s.push([a,b]);if(['star'].includes(cat))return[[[210,55],[245,165],[360,165],[270,230],[305,345],[210,275],[115,345],[150,230],[60,165],[175,165],[210,55]]];if(['circle','ball','apple','clock','cookie','mug','smiley face','watch'].includes(cat)){let p=[];for(let i=0;i<=24;i++){let a=i*Math.PI*2/24;p.push([210+110*Math.cos(a),210+110*Math.sin(a)])}return[p]}if(['tree','flower','umbrella','mushroom'].includes(cat))return[[[210,70],[145,165],[175,165],[120,240],[165,240],[105,320],[210,285],[315,320],[255,240],[300,240],[245,165],[275,165],[210,70]],[[195,285],[195,345],[225,345],[225,285]]];if(cat==='house'||cat==='door')return[[[75,200],[210,80],[345,200],[345,335],[75,335],[75,200]],[[165,335],[165,235],[245,235],[245,335]]];if(cat==='fish')return[[[65,210],[145,130],[275,135],[350,210],[275,285],[145,290],[65,210]],[[350,210],[390,165],[390,255],[350,210]]];if(cat==='car'||cat==='bus')return[[[75,270],[105,195],[160,195],[190,145],[265,145],[305,195],[345,195],[365,270],[75,270]],[[75,270],[75,305],[365,305],[365,270]]];if(cat==='mountain')return[[[60,320],[155,130],[210,210],[285,90],[370,320],[60,320]]];if(cat==='banana')return[[[90,150],[140,125],[205,145],[275,205],[330,280],[300,305],[240,260],[175,200],[110,185],[90,150]]];if(cat==='flower')return[[[210,120],[235,180],[300,180],[250,220],[270,285],[210,245],[150,285],[170,220],[120,180],[185,180],[210,120]],[[210,245],[210,345]]];if(cat==='pencil'||cat==='rocket'||cat==='bottle'||cat==='key'||cat==='shoe'||cat==='guitar'||cat==='hammer'||cat==='fork'||cat==='spoon'||cat==='chair'||cat==='book'||cat==='camera'||cat==='basket'||cat==='bucket'||cat==='hat'||cat==='cup'||cat==='mug'||cat==='pizza'||cat==='rocket'||cat==='bicycle'||cat==='bird'||cat==='cat'||cat==='dog'||cat==='rabbit'||cat==='duck'||cat==='elephant'||cat==='butterfly'||cat==='airplane')return[[[90,300],[330,120],[350,145],[110,325],[90,300]]];return[[[100,300],[100,120],[320,120],[320,300],[100,300]]];}
function aug(sts){return sts.map(st=>st.map(p=>{let q=.9+Math.random()*.2,dx=(Math.random()-.5)*16,dy=(Math.random()-.5)*16;return[210+(p[0]-210)*q+dx,210+(p[1]-210)*q+dy]}))}
function examples(){let xs=[],ys=[];for(let ci=0;ci<CATEGORIES.length;ci++){let base=genericSeed(CATEGORIES[ci]);for(let k=0;k<5;k++){xs.push(tensorFor(aug(base)));ys.push(ci)}}for(let ci=0;ci<CATEGORIES.length;ci++)for(const packed of(learned[CATEGORIES[ci]]||[])){xs.push(tensorFor(JSON.parse(packed)));ys.push(ci)}return{xs,ys}}
async function train(){const{xs,ys}=examples();let X=tf.tensor2d(xs),Y=tf.oneHot(tf.tensor1d(ys,'int32'),CATEGORIES.length);if(model)model.dispose();model=tf.sequential();model.add(tf.layers.dense({inputShape:[784],units:128,activation:'relu'}));model.add(tf.layers.dropout({rate:.12}));model.add(tf.layers.dense({units:64,activation:'relu'}));model.add(tf.layers.dense({units:CATEGORIES.length,activation:'softmax'}));model.compile({optimizer:tf.train.adam(.002),loss:'categoricalCrossentropy',metrics:['accuracy']});await model.fit(X,Y,{epochs:18,batchSize:32,shuffle:true,verbose:0});X.dispose();Y.dispose();statusEl.textContent=`Neural network ready · ${xs.length} training examples`;updateStats()}
async function classify(sts){if(!sts.length)return['nothing',0];return tf.tidy(()=>{let x=tf.tensor2d([tensorFor(sts)]),p=model.predict(x).dataSync(),best=0;for(let i=1;i<p.length;i++)if(p[i]>p[best])best=i;return[CATEGORIES[best],p[best]]})}
function saveExample(cat,sts){if(!learned[cat])learned[cat]=[];learned[cat].push(JSON.stringify(sts));if(learned[cat].length>100)learned[cat].shift();localStorage.setItem(STORE,JSON.stringify(learned));updateStats()}
startBtn.onclick=start;
(async()=>{statusEl.textContent='Loading TensorFlow.js…';await tf.ready();await train();startBtn.disabled=false;resultEl.textContent='Ready!';})();
</script></body></html>
