<script>
const C=['airplane','apple','ball','banana','basket','bicycle','bird','book','bottle','bow','bucket','bus','butterfly','cake','camera','car','cat','chair','cloud','clock','cookie','cup','dog','door','duck','ear','elephant','fish','flower','fork','guitar','hammer','hat','house','key','leaf','moon','mountain','mug','pencil','pizza','rabbit','rocket','shoe','smiley face','star','sun','tree','umbrella','watch'];
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),targetEl=document.getElementById('target'),timerEl=document.getElementById('timer'),bar=document.getElementById('bar'),resultEl=document.getElementById('result'),statusEl=document.getElementById('status'),startBtn=document.getElementById('start'),clearBtn=document.getElementById('clear'),eraserBtn=document.getElementById('eraser');
let strokes=[],cur=[],drawing=false,active=false,started=0,raf=0,target='',score=0,erasing=false;const STORE='draw10-training-v2';let learned=JSON.parse(localStorage.getItem(STORE)||'{}');
function stats(){document.getElementById('score').textContent=score;document.getElementById('learned').textContent=Object.values(learned).reduce((a,b)=>a+b.length,0)}
function resetCanvas(){ctx.fillStyle='white';ctx.fillRect(0,0,420,420);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=9;ctx.strokeStyle='#111'}resetCanvas();stats();
function pos(e){let r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*420/r.width,(e.clientY-r.top)*420/r.height]}
function begin(e){if(!active||erasing)return;canvas.setPointerCapture(e.pointerId);drawing=true;cur=[pos(e)];ctx.beginPath();ctx.moveTo(...cur[0])}
function move(e){if(!drawing)return;let p=pos(e);cur.push(p);ctx.lineTo(...p);ctx.stroke()}
function end(){if(drawing&&cur.length>1)strokes.push(cur);drawing=false;cur=[]}canvas.addEventListener('pointerdown',begin);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function erase(e){if(!active||!erasing)return;let[x,y]=pos(e),r=25;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();strokes=strokes.filter(s=>!s.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+7))}canvas.addEventListener('pointerdown',erase);canvas.addEventListener('pointermove',erase);
eraserBtn.onclick=()=>{erasing=!erasing;eraserBtn.textContent='Eraser: '+(erasing?'On':'Off');eraserBtn.classList.toggle('active',erasing);canvas.style.cursor=erasing?'cell':'crosshair'};

function choose(){target=C[Math.floor(Math.random()*C.length)];targetEl.textContent=target}
function start(){strokes=[];resetCanvas();choose();active=true;startBtn.disabled=true;started=performance.now();tick()}
function tick(){if(!active)return;let left=Math.max(0,10000-(performance.now()-started));timerEl.textContent=(left/1000).toFixed(1);timerEl.classList.toggle('danger',left<3000);bar.style.width=(left/100)+'%';if(left<=0){endRound();return}raf=requestAnimationFrame(tick)}
function normalize(ss){if(!ss.length)return null;let p=ss.flat(),minX=Math.min(...p.map(x=>x[0])),maxX=Math.max(...p.map(x=>x[0])),minY=Math.min(...p.map(x=>x[1])),maxY=Math.max(...p.map(x=>x[1])),w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),s=Math.min(330/w,330/h),ox=210-(minX+maxX)*s/2,oy=210-(minY+maxY)*s/2;return ss.map(st=>st.map(q=>[q[0]*s+ox,q[1]*s+oy]))}
function features(ss){let n=normalize(ss),a=new Float32Array(196);if(!n)return a;let off=document.createElement('canvas');off.width=14;off.height=14;let c=off.getContext('2d');c.fillStyle='white';c.fillRect(0,0,14,14);c.strokeStyle='black';c.lineWidth=.9;c.lineCap='round';c.lineJoin='round';for(let st of n){if(st.length<2)continue;c.beginPath();c.moveTo(st[0][0]/30,st[0][1]/30);for(let i=1;i<st.length;i++)c.lineTo(st[i][0]/30,st[i][1]/30);c.stroke()}let d=c.getImageData(0,0,14,14).data;for(let i=0;i<196;i++)a[i]=1-d[i*4]/255;return a}
function seed(cat){let s=[],L=(a,b)=>s.push([a,b]);if(cat==='star')return[[[210,55],[245,165],[360,165],[270,230],[305,345],[210,275],[115,345],[150,230],[60,165],[175,165],[210,55]]];if(['ball','apple','clock','cookie','watch'].includes(cat)){let p=[];for(let i=0;i<=28;i++){let a=i*Math.PI*2/28;p.push([210+105*Math.cos(a),210+105*Math.sin(a)])}return[p]}if(cat==='sun'){let p=[];for(let i=0;i<=20;i++){let a=i*Math.PI*2/20;p.push([210+90*Math.cos(a),210+90*Math.sin(a)])}return[p]}if(cat==='flower')return[[[210,110],[235,175],[305,175],[250,215],[275,285],[210,245],[145,285],[170,215],[115,175],[185,175],[210,110]],[[210,245],[210,350]]];if(cat==='house')return[[[70,205],[210,75],[350,205],[350,335],[70,335],[70,205]],[[165,335],[165,235],[250,235],[250,335]]];if(cat==='door')return[[[120,100],[300,100],[300,335],[120,335],[120,100]],[[155,335],[155,220],[265,220],[265,335]]];if(cat==='fish')return[[[55,210],[140,135],[275,140],[350,210],[275,280],[140,285],[55,210]],[[350,210],[395,160],[395,260],[350,210]]];if(['car','bus'].includes(cat))return[[[60,275],[95,200],[155,200],[185,150],[270,150],[305,200],[350,200],[375,275],[60,275]],[[75,275],[75,315],[360,315],[360,275]],[[120,315],[120,285]],[[315,315],[315,285]]];if(cat==='mountain')return[[[55,325],[155,125],[215,210],[285,95],[375,325],[55,325]]];if(cat==='banana')return[[[80,150],[140,120],[210,145],[275,195],[335,270],[300,305],[245,260],[175,200],[110,185],[80,150]]];if(cat==='umbrella')return[[[70,190],[105,130],[165,100],[235,100],[300,130],[350,190],[70,190]],[[210,190],[210,330],[250,350],[275,335]]];if(cat==='cloud')return[[[80,275],[75,235],[105,205],[145,205],[160,165],[205,145],[250,165],[265,205],[315,205],[345,235],[340,275],[80,275]]];if(cat==='moon'){let p=[];for(let i=0;i<=25;i++){let a=Math.PI*1.15+i*Math.PI*1.7/25;p.push([225+105*Math.cos(a),210+105*Math.sin(a)])}let q=[];for(let i=0;i<=18;i++){let a=-Math.PI*.7+i*Math.PI*1.4/18;q.push([270+100*Math.cos(a),205+100*Math.sin(a)])}return[p,q]}if(cat==='leaf')return[[[210,70],[145,145],[120,220],[150,285],[210,340],[270,285],[300,220],[275,145],[210,70]],[[210,340],[210,120]]];if(cat==='bird')return[[[75,230],[145,175],[210,230],[275,175],[345,230]],[[145,175],[210,260],[275,175]]];if(cat==='butterfly')return[[[210,210],[150,130],[80,145],[100,220],[170,250],[210,210],[250,250],[320,220],[340,145],[270,130],[210,210]],[[210,210],[210,335]]];if(cat==='airplane')return[[[55,215],[175,205],[220,80],[250,205],[365,215],[250,230],[220,345],[190,230],[55,215]]];if(cat==='bicycle')return[[[115,285],[115,190],[210,285],[315,285],[210,285],[175,175]],[[115,285],[70,285]],[[315,285],[350,285]]];if(['cup','mug'].includes(cat))return[[[120,125],[300,125],[280,330],[140,330],[120,125]],[[300,170],[350,170],[350,270],[285,270]]];if(cat==='pizza')return[[[90,310],[330,310],[210,100],[90,310]],[[150,270],[165,250]],[[250,245],[265,225]],[[205,195],[215,180]]];if(cat==='rocket')return[[[210,70],[150,190],[150,300],[210,345],[270,300],[270,190],[210,70]],[[150,260],[95,315],[150,315]],[[270,260],[325,315],[270,315]],[[185,230],[235,230],[235,280],[185,280],[185,230]]];if(cat==='bottle')return[[[175,80],[245,80],[245,130],[275,160],[275,330],[145,330],[145,160],[175,130],[175,80]],[[185,80],[235,80]]];if(cat==='pencil')return[[[90,300],[300,90],[340,130],[130,340],[90,300]],[[300,90],[325,65],[340,80],[340,130]]];if(cat==='key')return[[[100,170],[100,250],[185,250],[210,280],[235,250],[280,250],[280,220],[240,220],[240,190],[280,190],[280,170],[100,170]],[[130,145],[160,145],[160,275],[130,275],[130,145]]];if(cat==='shoe')return[[[90,140],[145,145],[165,245],[275,265],[345,300],[330,340],[105,340],[75,300],[90,140]]];if(cat==='hat')return[[[130,210],[150,120],[270,120],[290,210]],[[80,210],[340,210],[330,260],[90,260],[80,210]]];if(cat==='book')return[[[90,115],[210,145],[330,115],[330,325],[210,350],[90,325],[90,115]],[[210,145],[210,350]]];if(cat==='camera')return[[[80,160],[145,160],[170,130],[250,130],[275,160],[340,160],[340,300],[80,300],[80,160]],[[170,225],[170,205],[190,185],[230,185],[250,205],[250,245],[230,265],[190,265],[170,245],[170,225]]];if(cat==='chair')return[[[120,110],[300,110],[300,220],[260,220],[260,330],[120,330],[120,110]],[[120,220],[300,220]]];if(cat==='fork')return[[[150,80],[150,180],[175,210],[175,340]],[[190,80],[190,180],[175,210]],[[230,80],[230,180],[175,210]]];if(cat==='guitar')return[[[210,75],[175,130],[180,180],[145,230],[145,285],[175,325],[245,325],[275,285],[275,230],[240,180],[245,130],[210,75]],[[210,120],[210,290]]];if(cat==='hammer')return[[[90,100],[300,100],[300,155],[90,155],[90,100]],[[195,155],[195,340]]];if(cat==='basket'||cat==='bucket')return[[[110,150],[310,150],[285,335],[135,335],[110,150]],[[130,150],[130,95],[290,95],[290,150]]];if(cat==='bow')return[[[100,100],[210,210],[100,320]],[[320,100],[210,210],[320,320]],[[100,100],[320,320]]];if(cat==='smiley face'){let p=[];for(let i=0;i<=28;i++){let a=i*Math.PI*2/28;p.push([210+120*Math.cos(a),210+120*Math.sin(a)])}return[p,[[165,180],[175,170]],[[245,170],[255,180]],[[155,250],[180,270],[210,278],[240,270],[265,250]]]}if(cat==='ear')return[[[245,330],[180,315],[140,270],[140,190],[165,120],[225,95],[280,120],[305,175],[290,230],[250,250],[220,230],[210,195],[230,175],[250,185]]];if(cat==='elephant')return[[[105,280],[95,200],[120,150],[180,130],[250,145],[300,190],[315,250],[285,285],[250,270],[210,300],[160,300],[105,280]],[[250,200],[350,205],[385,225],[350,245],[315,245]],[[140,280],[140,345]],[[180,290],[180,350]]];if(cat==='cat'||cat==='rabbit'||cat==='dog'||cat==='duck')return[[[110,300],[100,180],[145,125],[175,165],[245,165],[275,125],[320,180],[310,300],[110,300]],[[165,220],[180,230]],[[240,230],[255,220]]];if(cat==='cake')return[[[105,180],[315,180],[315,300],[105,300],[105,180]],[[80,300],[340,300]],[[140,180],[140,130],[140,110]],[[210,180],[210,120],[210,100]],[[280,180],[280,135],[280,115]]];if(cat==='apple')return[[[210,100],[165,95],[125,125],[110,190],[125,270],[180,325],[240,325],[295,270],[310,190],[295,125],[255,95],[210,100]],[[210,100],[230,65],[260,55]]];return[[[100,120],[320,120],[320,300],[100,300],[100,120]]];}
function aug(ss){let q=.9+Math.random()*.2,dx=(Math.random()-.5)*18,dy=(Math.random()-.5)*18;return ss.map(st=>st.map(p=>[210+(p[0]-210)*q+dx,210+(p[1]-210)*q+dy]))}
function dataset(){let X=[],Y=[];for(let i=0;i<C.length;i++){let b=seed(C[i]);for(let k=0;k<5;k++){X.push(features(aug(b)));Y.push(i)}}for(let i=0;i<C.length;i++)for(let z of(learned[C[i]]||[])){try{X.push(features(JSON.parse(z)));Y.push(i)}catch(e){}}return[X,Y]}
// Small neural network implemented directly in JavaScript: no TensorFlow, CDN, modules, or network access.
let W1,B1,W2,B2,ready=false;const H=48,N=C.length,IN=196;
function rand(n){let a=new Float32Array(n),s=Math.sqrt(2/n);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*s;return a}
function init(){W1=rand(IN*H);B1=new Float32Array(H);W2=rand(H*N);B2=new Float32Array(N)}
function forward(x){let h=new Float32Array(H);for(let j=0;j<H;j++){let v=B1[j];for(let i=0;i<IN;i++)v+=x[i]*W1[i*H+j];h[j]=v>0?v:0}let o=new Float32Array(N),m=-1e9;for(let k=0;k<N;k++){let v=B2[k];for(let j=0;j<H;j++)v+=h[j]*W2[j*N+k];o[k]=v;if(v>m)m=v}let sum=0;for(let k=0;k<N;k++){o[k]=Math.exp(o[k]-m);sum+=o[k]}for(let k=0;k<N;k++)o[k]/=sum;return[h,o]}
function trainNN(X,Y){init();let order=Array.from({length:Y.length},(_,i)=>i),epochs=14,lr=.018;for(let ep=0;ep<epochs;ep++){for(let z=order.length-1;z>0;z--){let j=Math.floor(Math.random()*(z+1)),t=order[z];order[z]=order[j];order[j]=t}for(let ii of order){let x=X[ii],y=Y[ii],[h,o]=forward(x),do_=o;do_[y]-=1;let dh=new Float32Array(H);for(let j=0;j<H;j++){let v=0;for(let k=0;k<N;k++)v+=W2[j*N+k]*do_[k];dh[j]=h[j]>0?v:0}for(let j=0;j<H;j++){for(let k=0;k<N;k++)W2[j*N+k]-=lr*h[j]*do_[k];}for(let k=0;k<N;k++)B2[k]-=lr*do_[k];for(let i=0;i<IN;i++){let xi=x[i];if(xi===0)continue;for(let j=0;j<H;j++)W1[i*H+j]-=lr*xi*dh[j]}for(let j=0;j<H;j++)B1[j]-=lr*dh[j]}}ready=true}
function classify(ss){if(!ss.length)return['nothing',0];let[h,o]=forward(features(ss)),best=0;for(let i=1;i<N;i++)if(o[i]>o[best])best=i;return[C[best],o[best]]}
function save(cat,ss){if(!learned[cat])learned[cat]=[];learned[cat].push(JSON.stringify(ss));if(learned[cat].length>100)learned[cat].shift();localStorage.setItem(STORE,JSON.stringify(learned));stats()}
async function train(){statusEl.textContent='Training the neural network…';await new Promise(r=>setTimeout(r,20));let[X,Y]=dataset();trainNN(X,Y);statusEl.textContent='Neural network ready · '+X.length+' training examples';stats()}
async function endRound(){active=false;end();timerEl.textContent='0.0';bar.style.width='0%';resultEl.textContent='Thinking…';let[label,conf]=classify(strokes);if(label===target&&conf>=.20){score++;save(target,strokes);resultEl.textContent='🎉 You win! The network said “'+label+'” ('+Math.round(conf*100)+'%).';await train()}else resultEl.textContent='Not quite — I saw “'+label+'” ('+Math.round(conf*100)+'%).';statusEl.textContent=ready?'Neural network ready · '+Object.values(learned).reduce((a,b)=>a+b.length,0)+' learned examples':'Training…';stats();startBtn.disabled=false;startBtn.textContent='Next round';timerEl.classList.remove('danger')}
startBtn.onclick=start;
(async()=>{init();await train();startBtn.disabled=false;resultEl.textContent='Ready!';})();
